[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && python scripts/paas_bootstrap.py ensure"

[deploy]
startCommand = "gunicorn \"app:create_app()\" --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile -"
healthcheckPath = "/api/ready"
healthcheckTimeout = 600
