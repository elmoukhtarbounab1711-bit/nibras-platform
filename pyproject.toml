[project]
name = "nibras"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "PyJWT>=2.8,<3.0",
    "argon2-cffi>=23,<25",
    "pyotp>=2.9,<3.0",
    "gunicorn>=22,<24",
    "Jinja2>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
    "reportlab>=4.0,<5.0",
    "arabic-reshaper>=3.0,<4.0",
    "python-bidi>=0.4,<1.0",
    "pdfminer.six",
    "beautifulsoup4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "W"]
ignore = ["E501"]
