<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبراس — منارة المعرفة القانونية المغربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep:#0F1B2B; --ink-deep-2:#152238; --ink:#1C2D42;
    --parchment:#FAF6EE; --parchment-dim:#F1E9D8; --parchment-line:#E4D9C0;
    --brass:#B8863F; --brass-bright:#D9AB63; --brass-dim:#8C6A32;
    --verified:#3B6B4F; --danger:#A4473A; --text-muted:#7A7368;
    --text-muted-light:#B9C4D4;
    --shadow:0 20px 50px -20px rgba(15,27,43,0.35);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--parchment);color:var(--ink);
    font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:400;line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display{font-family:'Amiri',serif;font-weight:700;margin:0;color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--parchment-line);border-radius:8px;padding:10px 12px;
    width:100%;outline:none;transition:border-color .2s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--brass);}
  .container{max-width:1180px;margin:0 auto;padding:0 24px;}

  /* ===== header ===== */
  header{
    position:sticky;top:0;z-index:60;
    background:rgba(250,246,238,0.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--parchment-line);
  }
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;max-width:1180px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:8px;font-family:'Amiri',serif;font-weight:700;font-size:22px;white-space:nowrap;}
  .logo-mark{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  nav.topnav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none;}
  nav.topnav::-webkit-scrollbar{display:none;}
  nav.topnav a{
    white-space:nowrap;font-size:13.5px;padding:7px 11px;border-radius:8px;color:var(--ink);transition:all .2s;
  }
  nav.topnav a:hover{background:var(--parchment-dim);color:var(--brass-dim);}
  nav.topnav a.active{background:var(--ink);color:#fff;}
  .top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .icon-btn{
    background:none;border:1px solid var(--parchment-line);border-radius:9px;width:38px;height:38px;
    display:inline-flex;align-items:center;justify-content:center;position:relative;font-size:17px;color:var(--ink);
  }
  .icon-btn:hover{background:var(--parchment-dim);}
  .badge{
    position:absolute;top:-5px;left:-5px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;
    min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .user-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:none;
    border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;
  }
  .user-chip .role{font-size:11px;opacity:.75;font-weight:400;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;border:1px solid transparent;transition:all .2s;
  }
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.primary:hover{background:var(--ink-deep-2);}
  .btn.brass{background:var(--brass);color:#fff;}
  .btn.brass:hover{background:var(--brass-dim);}
  .btn.ghost{background:transparent;border-color:var(--parchment-line);color:var(--ink);}
  .btn.ghost:hover{background:var(--parchment-dim);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}

  /* ===== main ===== */
  main{padding:26px 0 60px;min-height:75vh;}
  .page-head{margin-bottom:22px;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--brass-dim);font-weight:600;margin-bottom:8px;}
  .eyebrow::before{content:"";width:20px;height:1px;background:var(--brass);display:inline-block;}
  .page-head h1{font-size:30px;}
  .page-head p{color:var(--text-muted);margin:6px 0 0;font-size:15px;}

  .muted{color:var(--text-muted);}
  .hint{font-size:12.5px;color:var(--text-muted);}
  .mono{direction:ltr;font-family:Consolas,monospace;}

  .card{
    background:#fff;border:1px solid var(--parchment-line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }
  .card h3{font-size:18px;margin-bottom:8px;}
  .card h4{font-size:15.5px;margin-bottom:6px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:860px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .chip{
    background:#fff;border:1px solid var(--parchment-line);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--ink);transition:all .2s;
  }
  .chip:hover{background:var(--parchment-dim);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .list-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#fff;border:1px solid var(--parchment-line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s;
  }
  .list-item:hover{border-color:var(--brass);box-shadow:var(--shadow);}
  .list-item .title{font-weight:600;font-size:15px;}
  .list-item .sub{font-size:12.5px;color:var(--text-muted);}

  .tag{display:inline-block;background:var(--parchment-dim);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--brass-dim);margin:2px;}
  .tag.green{background:rgba(59,107,79,.12);color:var(--verified);}
  .tag.red{background:rgba(164,71,58,.12);color:var(--danger);}

  .empty{padding:40px;text-align:center;color:var(--text-muted);border:1px dashed var(--parchment-line);border-radius:var(--radius);}
  .loader{text-align:center;padding:30px;color:var(--text-muted);}
  .spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--parchment-line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .alert{padding:12px 16px;border-radius:9px;margin:12px 0;font-size:14px;border:1px solid transparent;}
  .alert.err{background:rgba(164,71,58,.08);border-color:rgba(164,71,58,.35);color:var(--danger);}
  .alert.ok{background:rgba(59,107,79,.08);border-color:rgba(59,107,79,.35);color:var(--verified);}
  .alert.info{background:rgba(184,134,63,.1);border-color:rgba(184,134,63,.35);color:var(--brass-dim);}

  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px;}
  .form-group .req{color:var(--danger);}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;}
  .form-row .form-group{flex:1;min-width:150px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--parchment-line);vertical-align:top;}
  th{background:var(--parchment-dim);font-weight:700;font-size:13px;color:var(--ink-deep-2);}
  tr:last-child td{border-bottom:none;}

  .article-content{white-space:pre-wrap;line-height:2;font-size:15px;background:var(--parchment-dim);padding:18px;border-radius:10px;border-right:3px solid var(--brass);}
  .explain-box{background:var(--parchment-dim);border-radius:10px;padding:18px;border-right:3px solid var(--verified);white-space:pre-wrap;line-height:2;font-size:15px;}

  .ad-card{
    background:linear-gradient(135deg,#fff,var(--parchment-dim));border:1px dashed var(--brass);
    border-radius:10px;padding:12px 16px;margin:16px 0;display:flex;align-items:center;gap:12px;
  }
  .ad-card .ad-tag{font-size:10.5px;color:var(--brass-dim);font-weight:700;letter-spacing:.5px;}
  .ad-card .ad-name{font-size:15px;font-weight:700;}

  .step{display:flex;gap:12px;padding:14px;background:#fff;border:1px solid var(--parchment-line);border-radius:10px;margin-bottom:10px;}
  .step .num{
    flex:0 0 34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  }
  .step.done .num{background:var(--verified);}
  .step .docs{background:var(--parchment-dim);border-radius:8px;padding:8px 12px;font-size:12.5px;white-space:pre-wrap;margin-top:8px;}

  .notif{display:flex;gap:12px;padding:14px;background:#fff;border:1px solid var(--parchment-line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;}
  .notif.unread{border-right:3px solid var(--brass);background:linear-gradient(90deg,#fff,var(--parchment-dim));}
  .notif:hover{border-color:var(--brass);}
  .notif .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:8px;background:var(--parchment-line);}
  .notif.unread .dot{background:var(--brass);}

  .comment{display:flex;gap:12px;padding:12px;background:#fff;border:1px solid var(--parchment-line);border-radius:10px;margin-bottom:10px;}
  .avatar{
    flex:0 0 40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .verified-badge{color:var(--verified);font-weight:700;}

  .home-hero{
    background:linear-gradient(135deg,var(--ink-deep),var(--ink-deep-2));
    color:#fff;border-radius:16px;padding:34px;margin-bottom:22px;text-align:center;
  }
  .home-hero h1{color:#fff;font-size:34px;margin-bottom:8px;}
  .home-hero p{opacity:.85;max-width:640px;margin:0 auto;}
  .module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:980px){.module-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.module-grid{grid-template-columns:1fr;}}
  .module{
    background:#fff;border:1px solid var(--parchment-line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;
  }
  .module:hover{border-color:var(--brass);transform:translateY(-2px);box-shadow:var(--shadow);}
  .module .ic{font-size:22px;margin-bottom:6px;}
  .module h3{font-size:16px;margin-bottom:3px;}
  .module p{font-size:12.5px;color:var(--text-muted);margin:0;}

  .stat-card{background:#fff;border:1px solid var(--parchment-line);border-radius:var(--radius);padding:16px;text-align:center;}
  .stat-card .num{font-family:'Amiri',serif;font-size:26px;font-weight:700;color:var(--brass-dim);}
  .stat-card .lbl{font-size:12.5px;color:var(--text-muted);}

  footer{margin-top:20px;border-top:1px solid var(--parchment-line);padding:20px 0 30px;text-align:center;color:var(--text-muted);font-size:13px;}
  footer a{color:var(--brass-dim);}

  .auth-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .auth-tab{flex:1;text-align:center;padding:10px;border:1px solid var(--parchment-line);border-radius:9px;background:#fff;font-weight:600;font-size:14px;}
  .auth-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .inline-form{display:flex;gap:8px;}
  .inline-form input{flex:1;}
  .inline-form button{flex:0 0 auto;}

  .reaction-btn{border:1px solid var(--parchment-line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;}
  .reaction-btn.active{background:var(--brass);color:#fff;border-color:var(--brass);}
  .breadcrumb{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;}
  .breadcrumb a{color:var(--brass-dim);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .grow{flex:1;}

  /* ===== الوضع الليلي (Dark Mode) ===== */
  html[data-theme="dark"]{
    --ink-deep:#0A101F; --ink-deep-2:#111B30; --ink:#E8E2D4;
    --parchment:#0E1526; --parchment-dim:#151E33; --parchment-line:#26334D;
    --brass:#D9AB63; --brass-bright:#E8C58A; --brass-dim:#C9A055;
    --verified:#7FBF9B; --danger:#D98A7D; --text-muted:#A7B1C4;
    --shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  html[data-theme="dark"] header{background:rgba(14,21,38,.94);}
  html[data-theme="dark"] .card,html[data-theme="dark"] .module,
  html[data-theme="dark"] .list-item,html[data-theme="dark"] .step,
  html[data-theme="dark"] .notif,html[data-theme="dark"] .comment,
  html[data-theme="dark"] .stat-card,html[data-theme="dark"] .chip,
  html[data-theme="dark"] .auth-tab,html[data-theme="dark"] .reaction-btn,
  html[data-theme="dark"] .article-card,html[data-theme="dark"] .portal-card{
    background:var(--parchment-dim);border-color:var(--parchment-line);
  }
  html[data-theme="dark"] .notif.unread{background:linear-gradient(90deg,var(--parchment-dim),#1A2440);}
  html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{
    background:#0E1526;color:var(--ink);border-color:var(--parchment-line);
  }
  html[data-theme="dark"] th{background:#1A2440;}
  html[data-theme="dark"] .article-content,html[data-theme="dark"] .explain-box{background:#1A2440;}
  html[data-theme="dark"] .home-hero{background:linear-gradient(135deg,#0A101F,#16233F);}
  html[data-theme="dark"] .ad-card{background:linear-gradient(135deg,#151E33,#1A2440);}
  html[data-theme="dark"] .tag{background:#1A2440;color:var(--brass-dim);}
  html[data-theme="dark"] .tag.green{background:rgba(127,191,155,.14);color:var(--verified);}
  html[data-theme="dark"] .tag.red{background:rgba(217,138,125,.14);color:var(--danger);}
  html[data-theme="dark"] .avatar{background:var(--brass);color:#0A101F;}
  html[data-theme="dark"] .btn.ghost{background:transparent;color:var(--ink);}
  html[data-theme="dark"] nav.topnav a.active{background:#fff;color:#0A101F;}
  html[data-theme="dark"] .step .docs{background:#1A2440;}
  html[data-theme="dark"] .pdf-searchbar{background:#1A2440;border-color:var(--parchment-line);}
  html[data-theme="dark"] .pdf-holder{background:#fff;}

  /* ===== عارض PDF ===== */
  .pdf-card{margin-bottom:20px;}
  .pdf-toolbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:#10182A;color:#fff;border-radius:12px 12px 0 0;padding:9px 14px;
  }
  .pdf-toolbar .pdf-title{font-weight:700;font-size:13.5px;margin-inline-end:auto;}
  .pdf-group{display:flex;align-items:center;gap:4px;}
  .tbtn{
    background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);
    border-radius:7px;min-width:31px;height:31px;padding:0 9px;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:background .2s;
  }
  .tbtn:hover{background:rgba(255,255,255,.26);}
  .tbtn:disabled{opacity:.4;cursor:not-allowed;}
  .pdf-page-in{width:56px;height:31px;text-align:center;background:#fff;color:#10182A;}
  .pdf-zoom{font-size:12px;min-width:46px;text-align:center;direction:ltr;}
  .pdf-searchbar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--parchment-dim);border-top:1px solid var(--parchment-line);padding:9px 14px;
  }
  .pdf-searchbar input{flex:1;min-width:180px;}
  .pdf-shell{
    position:relative;background:#2A2F3A;border-radius:0 0 12px 12px;
    padding:16px;overflow:auto;max-height:78vh;
  }
  .pdf-holder{position:relative;margin:0 auto;box-shadow:0 8px 28px rgba(0,0,0,.45);background:#fff;}
  .pdf-canvas{display:block;}
  .pdf-holder .textLayer{
    position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;
    line-height:1;opacity:.22;z-index:2;transform-origin:0 0;
  }
  .pdf-holder .textLayer span,.pdf-holder .textLayer br{
    color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0;
  }
  .pdf-holder .textLayer ::selection{background:rgba(0,0,255,.3);}
  .pdf-holder .textLayer .hl{background:rgba(255,215,0,.45);}
  @media (max-width:720px){
    .pdf-toolbar .pdf-title{width:100%;margin-inline-end:0;}
  }

  /* ===== هيكل التحميل (Skeleton) ===== */
  .sk-row{margin-bottom:14px;}
  .sk{
    background:linear-gradient(90deg,var(--parchment-dim) 25%,#fff 37%,var(--parchment-dim) 63%);
    background-size:400% 100%;border-radius:8px;
  }
  html[data-theme="dark"] .sk{
    background:linear-gradient(90deg,#151E33 25%,#1D2840 37%,#151E33 63%);
    background-size:400% 100%;
  }
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .sk{animation:shimmer 1.4s ease infinite;}

  /* ===== صفحات الخطأ ===== */
  .err-page{padding:64px 20px;text-align:center;border:none;}
  .err-code{font-family:'Amiri',serif;font-size:72px;font-weight:700;color:var(--brass);line-height:1;}
  .err-page h2{margin:10px 0 6px;font-size:24px;}
  .err-page p{color:var(--text-muted);margin:0 0 18px;}

  /* ===== بطاقات المقالات ===== */
  .article-card{
    background:#fff;border:1px solid var(--parchment-line);border-radius:var(--radius);
    padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:all .2s;
  }
  .article-card:hover{border-color:var(--brass);box-shadow:var(--shadow);transform:translateY(-2px);}
  .article-card h3{font-size:16px;margin:0;}
  .article-card .ac-cat{font-size:11px;font-weight:700;color:var(--brass-dim);letter-spacing:.3px;}
  .article-card .ac-title{font-size:13px;color:var(--verified);font-weight:600;}
  .article-card p{font-size:12.5px;color:var(--text-muted);margin:0;line-height:1.8;flex:1;}
  .article-card .ac-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;}
  .article-card .ac-views{font-size:12px;color:var(--text-muted);}

  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 14px;}
  .section-head h2{font-size:24px;}
  .section-head .more{font-size:13px;color:var(--brass-dim);font-weight:600;white-space:nowrap;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <a class="logo" href="#/">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" width="26" height="26"><path d="M12 2C12 2 9 6 9 10.5C9 13 10 14.5 12 15.5C14 14.5 15 13 15 10.5C15 6 12 2 12 2Z" fill="#B8863F"/><rect x="10.5" y="15.5" width="3" height="4" fill="#1C2D42"/><path d="M6 22H18" stroke="#1C2D42" stroke-width="1.4" stroke-linecap="round"/></svg></span>
      نبراس
    </a>
    <nav class="topnav" id="topnav"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="الوضع الليلي" style="display:inline-flex">🌙</button>
      <button class="icon-btn" id="bellBtn" title="الإشعارات" style="display:none">🔔<span class="badge" id="bellBadge" style="display:none">0</span></button>
      <span id="userArea"></span>
    </div>
  </div>
</header>

<main>
  <div class="container" id="app"></div>
</main>

<footer>
  <div class="container">
    <p>نبراس — منارة المعرفة القانونية المغربية · <a href="#" id="adminLink">لوحة الإدارة</a></p>
    <p class="hint">أداة تعليمية مدعومة بالذكاء الاصطناعي؛ لا تُغني عن استشارة مهني قانوني مرخّص.</p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';

/* ============ الإعدادات والحالة ============ */
const API_BASE = 'http://localhost:8000/api';
const TENANT_ID = ''; // مثال: املأه برقم/برمز مستأجر عند تفعيل NIBRAS_MULTI_TENANT=1

const LS_ACCESS = 'nibras_access';
const LS_REFRESH = 'nibras_refresh';

/* ============ أدوات مساعدة ============ */
function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function nl(v){ return esc(v).replace(/\n/g,'<br>'); }
function fmtMoney(cents){
  const dh = Math.round((cents||0)/100);
  return dh.toLocaleString('ar-MA') + ' درهم';
}
function fmtDate(dt){
  if(!dt) return '—';
  const d = new Date(String(dt).replace(' ','T'));
  if(isNaN(d)) return dt;
  return d.toLocaleDateString('ar-MA', {year:'numeric',month:'long',day:'numeric'});
}
function fmtDateTime(dt){
  if(!dt) return '—';
  const d = new Date(String(dt).replace(' ','T'));
  if(isNaN(d)) return dt;
  return d.toLocaleDateString('ar-MA', {year:'numeric',month:'numeric',day:'numeric'}) + ' · ' +
         d.toLocaleTimeString('ar-MA', {hour:'2-digit',minute:'2-digit'});
}
function $id(id){ return document.getElementById(id); }
function q(sel, root){ return (root||document).querySelector(sel); }
function qa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

/* ============ طبقة الاتصال بالـ API ============ */
async function api(path, opts={}){
  const o = {headers:{}, ...opts};
  const isForm = o.body instanceof FormData;
  if(!isForm && o.body != null && !o.headers['Content-Type']){
    o.headers['Content-Type'] = 'application/json';
  }
  if(state.access) o.headers['Authorization'] = 'Bearer ' + state.access;
  if(TENANT_ID) o.headers['X-Tenant-Id'] = TENANT_ID;

  let res;
  try{
    res = await fetch(API_BASE + path, o);
  }catch(e){
    throw new Error('تعذّر الاتصال بالخادم. تأكد أن نبراس يعمل على المنفذ 8000.');
  }

  if(res.status === 401 && state.refresh && !o._retry){
    const ok = await tryRefresh();
    if(ok){ o._retry = true; return api(path, o); }
  }

  let data = null;
  const ct = res.headers.get('content-type') || '';
  if(ct.includes('application/json')){
    data = await res.json().catch(() => null);
  }
  if(!res.ok){
    const msg = (data && (data.error || data.message)) || ('خطأ (HTTP ' + res.status + ')');
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}
function apiGet(path){ return api(path); }
function apiPost(path, body){ return api(path, {method:'POST', body: JSON.stringify(body||{})}); }
function apiPut(path, body){ return api(path, {method:'PUT', body: JSON.stringify(body||{})}); }
function apiDel(path){ return api(path, {method:'DELETE'}); }

async function tryRefresh(){
  try{
    const r = await fetch(API_BASE + '/auth/refresh', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: state.refresh}),
    });
    if(!r.ok) return false;
    const data = await r.json();
    setSession(data);
    return true;
  }catch(e){ return false; }
}
function setSession(data){
  state.access = data.access_token;
  state.refresh = data.refresh_token;
  state.user = data.user;
  localStorage.setItem(LS_ACCESS, data.access_token);
  localStorage.setItem(LS_REFRESH, data.refresh_token);
  localStorage.setItem(LS_USER, JSON.stringify(data.user));
  renderShell();
}
function logout(){
  if(state.refresh){
    apiPost('/auth/logout', {refresh_token: state.refresh}).catch(()=>{});
  }
  state.access = state.refresh = null; state.user = null;
  localStorage.removeItem(LS_ACCESS); localStorage.removeItem(LS_REFRESH); localStorage.removeItem(LS_USER);
  renderShell(); go('#/account');
}
function isLoggedIn(){ return !!state.user; }
function isAdmin(){ return state.user && state.user.roles && state.user.roles.includes('admin'); }

async function refreshBell(){
  if(!state.user) return;
  try{
    const d = await apiGet('/notifications/unread-count');
    const n = d.unread_count||0;
    $id('bellBadge').textContent = n;
    $id('bellBadge').style.display = n>0 ? 'flex':'none';
  }catch(e){}
}

function go(h){ location.hash = h; }

function parseRoute(){
  const raw = location.hash.replace(/^#\/?/, '') || '';
  const [seg, queryStr] = raw.split('?');
  const parts = seg.split('/').filter(Boolean).map(decodeURIComponent);
  const query = {};
  (queryStr||'').split('&').forEach(kv => {
    const [k,v] = kv.split('=');
    if(k) query[k] = decodeURIComponent(v||'');
  });
  return {parts, query};
}

async function router(){
  renderShell();
  const {parts, query} = parseRoute();
  const app = $id('app');
  app.innerHTML = '<div class="loader"><span class="spinner"></span></div>';
  window.scrollTo(0,0);
  try{
    if(parts.length === 0) return await viewHome(app);
    switch(parts[0]){
      case 'library':
        if(parts[1]==='text') return await viewText(app, parseInt(parts[2]));
        if(parts[1]==='article') return await viewArticle(app, parseInt(parts[2]));
        return await viewLibrary(app, query);
      case 'search': return await viewSearch(app, query);
      case 'ai': return await viewAI(app);
      case 'calculators': return await viewCalculators(app);
      case 'procedures':
        if(parts[1]) return await viewProcedure(app, parts[1]);
        return await viewProcedures(app);
      case 'documents':
        if(parts[1]==='my') return await viewMyDocuments(app);
        if(parts[1]) return await viewDocumentTemplate(app, parts[1]);
        return await viewDocuments(app);
      case 'community':
        if(parts[1]==='post') return await viewPost(app, parseInt(parts[2]));
        return await viewCommunity(app);
      case 'marketplace':
        if(parts[1]==='template') return await viewTemplate(app, parseInt(parts[2]));
        return await viewMarketplace(app, query);
      case 'professionals':
        if(parts[1]) return await viewProfessional(app, parseInt(parts[1]));
        return await viewProfessionals(app, query);
      case 'notifications': return await viewNotifications(app);
      case 'account': return await viewAccount(app);
      case 'ads': return await viewAds(app);
      default: return view404(app);
    }
  }catch(e){
    view500(app, e.message);
  }
}

/* ============ عارض PDF (pdf.js) ============ */
let _pdfDoc = null, _pdfPage = 1, _pdfZoom = 1, _pdfRot = 0, _pdfNumPages = 0;
let _pdfMatches = [], _pdfMatchIdx = 0, _pdfTextId = null;

function pdfUrlFor(id){ return API_BASE + '/texts/' + id + '/pdf'; }

async function initPdfViewer(id){
  _pdfTextId = id;
  const wrap = $id('pdfPageWrap');
  if(!wrap) return;
  pdfWireToolbar();
  try{
    if(typeof pdfjsLib === 'undefined'){
      wrap.innerHTML = '<div class="alert err">عارض PDF غير متاح — تحقق من اتصال الإنترنت لتحميل مكتبة PDF.js.</div>';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    _pdfDoc = await pdfjsLib.getDocument({url: pdfUrlFor(id)}).promise;
    _pdfNumPages = _pdfDoc.numPages;
    _pdfPage = 1; _pdfZoom = 1; _pdfRot = 0; _pdfMatches = [];
    await pdfRenderPage();
  }catch(e){
    wrap.innerHTML = '<div class="alert err">تعذّر تحميل النص PDF: ' + esc(e.message) + '</div>';
  }
}

function pdfCurrentViewport(page){
  const shell = $id('pdfShell');
  const avail = Math.max((shell ? shell.clientWidth : 600) - 32, 320);
  const base = page.getViewport({scale: 1, rotation: _pdfRot});
  const scale = (_pdfZoom * avail) / base.width;
  return page.getViewport({scale, rotation: _pdfRot});
}

async function pdfRenderPage(){
  if(!_pdfDoc) return;
  const page = await _pdfDoc.getPage(_pdfPage);
  const viewport = pdfCurrentViewport(page);
  const wrap = $id('pdfPageWrap');
  if(!wrap) return;
  wrap.innerHTML = '';
  const holder = document.createElement('div');
  holder.className = 'pdf-holder';
  const w = Math.floor(viewport.width), h = Math.floor(viewport.height);
  holder.style.width = w + 'px'; holder.style.height = h + 'px';
  const canvas = document.createElement('canvas');
  canvas.className = 'pdf-canvas';
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const tlayer = document.createElement('div');
  tlayer.className = 'textLayer';
  tlayer.style.width = w + 'px'; tlayer.style.height = h + 'px';
  holder.appendChild(canvas);
  holder.appendChild(tlayer);
  wrap.appendChild(holder);
  const ctx = canvas.getContext('2d');
  try{ await page.render({canvasContext: ctx, viewport, canvas}).promise; }catch(e){}
  try{
    const tc = await page.getTextContent();
    pdfjsLib.renderTextLayer({textContentSource: tc, container: tlayer, viewport, pageIndex: _pdfPage - 1});
  }catch(e){}
  pdfUpdateToolbar();
  if(_pdfMatches.length) pdfHighlight();
}

function pdfUpdateToolbar(){
  const set = (id, v) => { const el = $id(id); if(el) el.textContent = v; };
  const inp = $id('pdfPageIn');
  if(inp){ inp.value = _pdfPage; inp.max = _pdfNumPages; }
  set('pdfTotal', '/ ' + _pdfNumPages);
  set('pdfZoomLbl', Math.round(_pdfZoom * 100) + '%');
  const prev = $id('pdfPrev'), next = $id('pdfNext');
  if(prev) prev.disabled = _pdfPage <= 1;
  if(next) next.disabled = _pdfPage >= _pdfNumPages;
}

function pdfWireToolbar(){
  const on = (id, fn) => { const el = $id(id); if(el) el.onclick = fn; };
  on('pdfPrev', () => { if(_pdfDoc && _pdfPage > 1){ _pdfPage--; pdfRenderPage(); } });
  on('pdfNext', () => { if(_pdfDoc && _pdfPage < _pdfNumPages){ _pdfPage++; pdfRenderPage(); } });
  const pin = $id('pdfPageIn');
  if(pin) pin.onchange = () => {
    const n = parseInt(pin.value) || 1;
    _pdfPage = Math.min(Math.max(n, 1), _pdfNumPages);
    pdfRenderPage();
  };
  on('pdfZoomOut', () => { if(!_pdfDoc) return; _pdfZoom = Math.max(0.25, _pdfZoom - 0.15); pdfRenderPage(); });
  on('pdfZoomIn', () => { if(!_pdfDoc) return; _pdfZoom = Math.min(3, _pdfZoom + 0.15); pdfRenderPage(); });
  on('pdfFit', () => { if(!_pdfDoc) return; _pdfZoom = 1; pdfRenderPage(); });
  on('pdfRotate', () => { if(!_pdfDoc) return; _pdfRot = (_pdfRot + 90) % 360; pdfRenderPage(); });
  on('pdfFs', () => {
    if(!_pdfDoc) return;
    const shell = $id('pdfShell');
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(shell && shell.requestFullscreen) shell.requestFullscreen().catch(()=>{});
  });
  on('pdfPrint', () => { if(_pdfDoc) window.open(pdfUrlFor(_pdfTextId), '_blank'); });
  on('pdfSearch', () => {
    const b = $id('pdfSearchBar'); if(!b) return;
    const show = b.style.display === 'none';
    b.style.display = show ? 'flex' : 'none';
    if(show){ const q2 = $id('pdfQuery'); if(q2) q2.focus(); }
  });
  on('pdfSearchClose', () => {
    $id('pdfSearchBar').style.display = 'none';
    _pdfMatches = [];
    pdfRenderPage();
  });
  on('pdfSearchNext', () => pdfJumpMatch(1));
  on('pdfSearchPrev', () => pdfJumpMatch(-1));
  const pq = $id('pdfQuery');
  if(pq) pq.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); pdfRunSearch(pq.value); } });
}

async function pdfRunSearch(term){
  term = (term || '').trim();
  const info = $id('pdfMatchInfo'); if(!info) return;
  _pdfMatches = [];
  if(!term || !_pdfDoc){ info.textContent = ''; pdfRenderPage(); return; }
  const low = term.toLowerCase();
  try{
    for(let p = 1; p <= _pdfNumPages; p++){
      const page = await _pdfDoc.getPage(p);
      const tc = await page.getTextContent();
      const joined = tc.items.map(i => i.str || '').join('');
      const jl = joined.toLowerCase();
      let idx = jl.indexOf(low), n = 0;
      while(idx !== -1){ n++; idx = jl.indexOf(low, idx + low.length); }
      if(n > 0) _pdfMatches.push({page: p, count: n});
    }
  }catch(e){}
  _pdfMatchIdx = 0;
  if(!_pdfMatches.length){ info.textContent = 'لا نتائج مطابقة'; pdfRenderPage(); return; }
  pdfJumpMatch(0);
}

function pdfJumpMatch(dir){
  if(!_pdfMatches.length) return;
  _pdfMatchIdx = (_pdfMatchIdx + dir + _pdfMatches.length) % _pdfMatches.length;
  const m = _pdfMatches[_pdfMatchIdx];
  _pdfPage = m.page;
  const total = _pdfMatches.reduce((s, x) => s + x.count, 0);
  $id('pdfMatchInfo').textContent = (_pdfMatchIdx + 1) + ' / ' + _pdfMatches.length + ' صفحة — ' + total + ' نتيجة';
  pdfRenderPage();
}

function pdfHighlight(){
  const inp = $id('pdfQuery'); if(!inp) return;
  const term = (inp.value || '').trim().toLowerCase();
  if(!term) return;
  const tlayer = q('.pdf-holder .textLayer');
  if(!tlayer) return;
  qa('span', tlayer).forEach(sp => {
    if((sp.textContent || '').toLowerCase().includes(term)) sp.classList.add('hl');
  });
}

/* ============ الوضع الليلي ============ */
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  localStorage.setItem('nibras_theme', mode);
  const btn = $id('themeBtn');
  if(btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
  if(mode === 'dark'){ qa('.textLayer span').forEach(s => s.style.color = 'transparent'); }
}
function initTheme(){
  const saved = localStorage.getItem('nibras_theme');
  const pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const mode = (saved || (pref ? 'dark' : 'light'));
  document.documentElement.setAttribute('data-theme', mode);
  const btn = $id('themeBtn');
  if(btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
  if(btn) btn.onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

/* ============ عداد متحرك ============ */
function animateNum(el, target){
  const dur = 900, t0 = performance.now();
  function tick(t){
    const p = Math.min((t - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased).toLocaleString('ar-MA');
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function fieldHTML(f){
  const req = f.required ? '<span class="req">*</span>' : '';
  let input = '';
  if(f.type==='textarea') input = `<textarea name="${esc(f.name)}" rows="3"></textarea>`;
  else if(f.type==='select') input = `<select name="${esc(f.name)}"><option value="">— اختر —</option>${(f.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
  else if(f.type==='boolean') input = `<select name="${esc(f.name)}"><option value="false">لا</option><option value="true">نعم</option></select>`;
  else input = `<input type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" name="${esc(f.name)}" ${f.type==='number'&&f.min!=null?`min="${esc(f.min)}"`:''} ${f.type==='number'&&f.max!=null?`max="${esc(f.max)}"`:''}>`;
  return `<div class="form-group"><label>${esc(f.label||f.name)} ${req}</label>${input}</div>`;
}

async function downloadAuth(url, ext){
  try{
    const res = await fetch(url, {headers: state.access ? {Authorization:'Bearer '+state.access} : {}});
    if(!res.ok){ const d = await res.json().catch(()=>null); alert((d&&d.error)||'فشل التحميل'); return; }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'document.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  }catch(e){ alert(e.message); }
}

        <div class="form-group"><label>التقييم (1-5)</label>
          <select id="rRating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ★</option>`).join('')}</select></div>
        <div class="form-group"><label>تعليقك</label><textarea id="rComment" rows="2"></textarea></div>
        <button class="btn primary sm">إرسال التقييم</button>
      </form>`:''}`;
  const rv = $id('reviews');
  function renderReviews(list){
    rv.innerHTML = list.length ? list.map(r=>`
      <div class="comment">
        <div class="avatar">${esc((r.reviewer_name||'؟').charAt(0))}</div>
        <div style="flex:1">
          <div class="row"><strong>${esc(r.reviewer_name)}</strong><span class="tag green">${r.rating} ★</span><span class="hint">${fmtDateTime(r.created_at)}</span></div>
          ${r.comment?`<div style="margin-top:4px">${esc(r.comment)}</div>`:''}
        </div>
      </div>`).join('') : '<div class="empty">لا تقييمات بعد.</div>';
  }
  renderReviews(p.reviews||[]);
  const f = $id('reviewForm');
  if(f) f.onsubmit = async (e)=>{
    e.preventDefault();
    try{
      await apiPost('/professionals/' + id + '/reviews', {rating: parseInt($id('rRating').value), comment: $id('rComment').value.trim()});
      const fresh = await apiGet('/professionals/' + id);
      renderReviews(fresh.reviews||[]);
      $id('rComment').value = '';
      alert('تم تسجيل تقييمك.');
    }catch(e){ alert(e.message); }
  };
}

async function viewNotifications(app){
  if(!isLoggedIn()){ app.innerHTML = requireAuthMsg(app, 'الإشعارات'); return; }
  app.innerHTML = '<div class="loader"><span class="spinner"></span></div>';
  const [list, prefs] = await Promise.all([
    apiGet('/notifications?limit=50'),
    apiGet('/notifications/preferences').catch(()=>null),
  ]);
  app.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">الإشعارات</div>
      <h1>صندوق الإشعارات</h1>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn ghost sm" id="readAllBtn">تعليم الكل كمقروء</button>
    </div>
    <div id="notifList"></div>
    ${prefs?`
      <h3 style="margin:20px 0 10px">تفضيلات التسليم الخارجي</h3>
      <div class="card" id="prefsCard"></div>`:''}`;
  const listEl = $id('notifList');
  function renderList(items){
    listEl.innerHTML = items.length ? items.map(n=>`
      <div class="notif ${n.is_read?'':'unread'}" data-id="${n.id}">
        <div class="dot"></div>
        <div style="flex:1">
          <div class="row"><strong>${esc(n.title)}</strong><span class="hint">${fmtDateTime(n.created_at)}</span></div>
          <div>${esc(n.body||'')}</div>
        </div>
      </div>`).join('') : '<div class="empty">لا إشعارات بعد.</div>';
    qa('.notif', listEl).forEach(el=>el.onclick=async()=>{
      const id = el.dataset.id;
      if(!el.classList.contains('unread')){
        if(navigator.clipboard) el.style.opacity = .5;
        return;
      }
      try{ await apiPost(`/notifications/${id}/read`); el.classList.remove('unread'); refreshBell(); }catch(e){}
    });
  }
  renderList(list.notifications||[]);
  $id('readAllBtn').onclick = async ()=>{
    try{
      await apiPost('/notifications/read-all');
      const fresh = await apiGet('/notifications?limit=50');
      renderList(fresh.notifications||[]);
      refreshBell();
    }catch(e){ alert(e.message); }
  };
  const prefsEl = $id('prefsCard');
  if(prefsEl && prefs){
    const obj = prefs.preferences || {};
    const items = [];
    Object.keys(obj).forEach(ch => {
      Object.keys(obj[ch] || {}).forEach(t => items.push({channel: ch, type: t, enabled: !!obj[ch][t]}));
    });
    prefsEl.innerHTML = items.map((p,i)=>`
      <label style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--parchment-line);cursor:pointer">
        <span>${esc(p.channel==='email'?'البريد الإلكتروني':'الدفع الفوري')} · ${esc(p.type)}</span>
        <input type="checkbox" data-i="${i}" ${p.enabled?'checked':''}></label>`).join('') || '<p class="hint">لا تفضيلات.</p>';
    qa('#prefsCard input').forEach(chk=>chk.onchange=async()=>{
      const idx = parseInt(chk.dataset.i);
      const updated = items.map((p,i)=> i===idx ? {...p, enabled:chk.checked} : p);
      try{
        await apiPut('/notifications/preferences', {preferences: updated.map(p=>({channel: p.channel, notification_type: p.type, enabled: !!p.enabled}))});
      }catch(e){ alert(e.message); }
    });
  }
}

async function viewAccount(app){
  if(!isLoggedIn()){
    app.innerHTML = `
      <div class="page-head"><h1>الحساب</h1><p class="muted">سجّل الدخول أو أنشئ حسابًا جديدًا.</p></div>
      <div class="card" style="max-width:460px;margin:0 auto">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin">تسجيل الدخول</button>
          <button class="auth-tab" id="tabReg">إنشاء حساب</button>
        </div>
        <div id="authPane"></div>
      </div>`;
    const pane = $id('authPane');
    function loginPane(){
      pane.innerHTML = `
        <form id="loginForm">
          <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="lEmail" autocomplete="username"></div>
          <div class="form-group"><label>كلمة المرور</label><input type="password" id="lPass" autocomplete="current-password"></div>
          <button class="btn primary" style="width:100%" type="submit">دخول</button>
        </form>
        <div id="authMsg"></div>`;
      $id('loginForm').onsubmit = async (e)=>{
        e.preventDefault();
        const msg = $id('authMsg');
        msg.innerHTML = '<div class="loader"><span class="spinner"></span></div>';
        try{
          const d = await apiPost('/auth/login', {email:$id('lEmail').value.trim(), password:$id('lPass').value});
          setSession(d);
          go('#/');
        }catch(e){ msg.innerHTML = `<div class="alert err">${esc(e.message)}</div>`; }
      };
    }
    function regPane(){
      pane.innerHTML = `
        <form id="regForm">
          <div class="form-group"><label>الاسم الكامل <span class="req">*</span></label><input id="rName"></div>
          <div class="form-group"><label>البريد الإلكتروني <span class="req">*</span></label><input type="email" id="rEmail" autocomplete="username"></div>
          <div class="form-group"><label>كلمة المرور (8 أحرف على الأقل) <span class="req">*</span></label><input type="password" id="rPass" autocomplete="new-password"></div>
          <div class="form-group"><label>الدور</label>
            <select id="rRole">${REGISTER_ROLES.map(r=>`<option value="${r}">${esc(ROLE_LABELS[r]||r)}</option>`).join('')}</select></div>
          <button class="btn brass" style="width:100%" type="submit">إنشاء الحساب</button>
        </form>
        <div id="authMsg"></div>`;
      $id('regForm').onsubmit = async (e)=>{
        e.preventDefault();
        const msg = $id('authMsg');
        msg.innerHTML = '<div class="loader"><span class="spinner"></span></div>';
        try{
          const d = await apiPost('/auth/register', {email:$id('rEmail').value.trim(), password:$id('rPass').value, full_name:$id('rName').value.trim(), role:$id('rRole').value});
          setSession(d);
          go('#/');
        }catch(e){ msg.innerHTML = `<div class="alert err">${esc(e.message)}</div>`; }
      };
    }
    $id('tabLogin').onclick = ()=>{ $id('tabLogin').classList.add('active'); $id('tabReg').classList.remove('active'); loginPane(); };
    $id('tabReg').onclick = ()=>{ $id('tabReg').classList.add('active'); $id('tabLogin').classList.remove('active'); regPane(); };
    loginPane();
    return;
  }
  const u = state.user;
  app.innerHTML = `
    <div class="page-head"><h1>ملفي الشخصي</h1></div>
    <div class="card">
      <div class="row"><div class="avatar" style="width:52px;height:52px;font-size:20px">${esc((u.full_name||u.email).charAt(0))}</div>
        <div class="grow">
          <h3>${esc(u.full_name||'')}</h3>
          <p class="muted" style="margin:2px 0">${esc(u.email)}</p>
        </div>
        <span class="tag ${u.status==='active'?'green':'red'}">${esc(u.status)}</span>
      </div>
      <div style="margin-top:12px">${(u.roles||[]).map(r=>`<span class="tag">${esc(ROLE_LABELS[r]||r)}</span>`).join('')}</div>
      ${u.tenant_id?`<p class="hint" style="margin-top:8px">المستأجر: <span class="mono">${esc(u.tenant_id)}</span></p>`:''}
      <div class="row" style="margin-top:16px">
        <button class="btn ghost sm" onclick="logout()">تسجيل الخروج</button>
        ${isAdmin()?`<a class="btn primary sm" href="#/admin">لوحة الإدارة</a>`:''}
      </div>
    </div>`;
}
